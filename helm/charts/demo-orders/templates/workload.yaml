{{- $tls := .Values.backendTLS -}}
{{- $portName := ternary "https" "http" $tls.enabled -}}
{{- range $ver, $cfg := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api-{{ $ver }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
    app: orders-api
    version: {{ $ver }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: orders-api
      version: {{ $ver }}
  template:
    metadata:
      labels:
        app: orders-api
        version: {{ $ver }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpbin
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if $tls.enabled }}
          # Backend phục vụ HTTPS bằng cert do CA nội bộ ký (xem templates/backend-tls.yaml)
          args:
            - -https-cert-file=/etc/tls/tls.crt
            - -https-key-file=/etc/tls/tls.key
          {{- end }}
          ports:
            - name: {{ $portName }}
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: {{ $portName }}
              {{- if $tls.enabled }}
              scheme: HTTPS          # kubelet không kiểm tra cert khi probe
              {{- end }}
          livenessProbe:
            httpGet:
              path: /status/200
              port: {{ $portName }}
              {{- if $tls.enabled }}
              scheme: HTTPS
              {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if $tls.enabled }}
          volumeMounts:
            - name: backend-tls
              mountPath: /etc/tls
              readOnly: true
          {{- end }}
      {{- if $tls.enabled }}
      volumes:
        - name: backend-tls
          secret:
            secretName: {{ $tls.secretName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api-{{ $ver }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
    app: orders-api
    version: {{ $ver }}
spec:
  selector:
    app: orders-api
    version: {{ $ver }}
  ports:
    # Tên port "https" được BackendTLSPolicy tham chiếu qua sectionName
    - name: {{ $portName }}
      port: 8080
      targetPort: {{ $portName }}
{{- end }}
