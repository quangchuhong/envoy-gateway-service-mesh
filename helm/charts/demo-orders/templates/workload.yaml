{{- range $ver, $cfg := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api-{{ $ver }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
    app: orders-api
    version: {{ $ver }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: orders-api
      version: {{ $ver }}
  template:
    metadata:
      labels:
        app: orders-api
        version: {{ $ver }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpbin
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
          livenessProbe:
            httpGet:
              path: /status/200
              port: http
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api-{{ $ver }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "demo.labels" $ | nindent 4 }}
    app: orders-api
    version: {{ $ver }}
spec:
  selector:
    app: orders-api
    version: {{ $ver }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
