{{- $w2 := int .Values.canary.v2Weight -}}
# 4 HTTPRoute cho cùng host api.<domain>, tách theo hành vi để gắn BackendTrafficPolicy riêng.
# Gateway API chọn route theo độ ưu tiên: Exact > PathPrefix dài hơn > PathPrefix ngắn hơn.
#
# Mỗi backendRef gắn header "X-Backend-Version" (request -> httpbin echo lại trong body,
# response -> client đọc được) để kiểm tra canary.
{{- define "orders.backend" -}}
- name: orders-api-{{ .ver }}
  port: 8080
  {{- if hasKey . "weight" }}
  weight: {{ .weight }}
  {{- end }}
  filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
          - name: X-Backend-Version
            value: {{ .ver }}
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
          - name: X-Backend-Version
            value: {{ .ver }}
{{- end }}
---
# Route chính: canary theo header + trọng số, URL rewrite, thêm/xoá header
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "demo.parentRef" . | nindent 4 }}
  hostnames:
    - {{ include "demo.host" . | quote }}
  rules:
    - name: version-by-header
      matches:
        - path:
            type: PathPrefix
            value: /orders
          headers:
            - name: {{ .Values.canary.header.name }}
              value: {{ .Values.canary.header.value | quote }}
      filters:
        {{- include "orders.commonFilters" . | nindent 8 }}
      backendRefs:
        {{- include "orders.backend" (dict "ver" "v2") | nindent 8 }}
    - name: canary-by-weight
      matches:
        - path:
            type: PathPrefix
            value: /orders
      filters:
        {{- include "orders.commonFilters" . | nindent 8 }}
      backendRefs:
        {{- include "orders.backend" (dict "ver" "v1" "weight" (sub 100 $w2)) | nindent 8 }}
        {{- include "orders.backend" (dict "ver" "v2" "weight" $w2) | nindent 8 }}
{{- define "orders.commonFilters" -}}
- type: URLRewrite
  urlRewrite:
    path:
      type: ReplacePrefixMatch
      replacePrefixMatch: /anything/orders
- type: RequestHeaderModifier
  requestHeaderModifier:
    set:
      - name: X-Gateway
        value: envoy-gateway
    remove:
      - X-Debug-Internal
- type: ResponseHeaderModifier
  responseHeaderModifier:
    set:
      - name: Cache-Control
        value: no-store
{{- end }}
---
# Demo RETRY: backend /unstable lỗi 500 ngẫu nhiên khoảng 50%
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-unstable
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "demo.parentRef" . | nindent 4 }}
  hostnames:
    - {{ include "demo.host" . | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /orders/unstable
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /unstable
      backendRefs:
        {{- include "orders.backend" (dict "ver" "v1") | nindent 8 }}
---
# Demo TIMEOUT + CIRCUIT BREAKER: backend trả lời sau 5s
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-slow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "demo.parentRef" . | nindent 4 }}
  hostnames:
    - {{ include "demo.host" . | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /orders/slow
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /delay/5
      backendRefs:
        {{- include "orders.backend" (dict "ver" "v1") | nindent 8 }}
---
# Demo FAULT INJECTION: gateway tự chèn lỗi 503 và độ trễ
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-chaos
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "demo.parentRef" . | nindent 4 }}
  hostnames:
    - {{ include "demo.host" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders/chaos
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /anything/chaos
      backendRefs:
        {{- include "orders.backend" (dict "ver" "v1") | nindent 8 }}
