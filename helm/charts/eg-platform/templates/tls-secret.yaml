{{- if .Values.tls.create }}
{{- /*
  Cert self-signed cho đoạn NLB -> Envoy (NLB không verify cert của target).
  Dùng lookup để giữ nguyên cert qua các lần "helm upgrade".
  Lưu ý: "helm template" không truy cập cluster nên mỗi lần render sẽ sinh cert mới.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.tls.secretName -}}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ .Values.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eg-platform.labels" . | nindent 4 }}
data:
{{- if and $existing $existing.data }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cn := printf "*.%s" .Values.domain -}}
{{- $cert := genSelfSignedCert $cn nil (list $cn .Values.domain) (int .Values.tls.validityDays) }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
