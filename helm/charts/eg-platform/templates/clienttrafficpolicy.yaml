{{- $c := .Values.clientTraffic -}}
# ClientTrafficPolicy: cấu hình đoạn client -> Envoy cho toàn Gateway
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.gateway.name }}-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eg-platform.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  {{- if eq $c.clientIPDetection "xff" }}
  # Có F5/LB L7 phía trước: tin {{ $c.xffTrustedHops }} hop trong X-Forwarded-For
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ $c.xffTrustedHops }}
  {{- end }}
  healthCheck:
    path: {{ $c.healthCheckPath }}
  timeout:
    http:
      requestReceivedTimeout: {{ $c.requestReceivedTimeout }}
      idleTimeout: {{ $c.idleTimeout }}
  headers:
    requestID: PreserveOrGenerate
    {{- with $c.stripRequestHeaders }}
    earlyRequestHeaders:
      remove:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  tls:
    minVersion: "1.2"
