# Secret chứa API key: mỗi key trong Secret là "client id", giá trị là API key.
# Envoy Gateway đọc Secret này cho apiKeyAuth của SecurityPolicy.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.apiKeys.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
stringData:
  {{- range $client, $key := .Values.apiKeys.keys }}
  {{ $client }}: {{ required (printf "Thiếu API key cho %s: truyền --set apiKeys.keys.%s=<key>" $client $client) $key | quote }}
  {{- end }}
