{{- $code := .Files.Get "app/web_app.py" -}}
{{- range .Values.sites }}
{{- $site := . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
    app: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
      annotations:
        checksum/code: {{ $code | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # Rải Pod sang nhiều node để thấy Envoy gửi tới Pod ở node khác nhau
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ .name }}
      containers:
        - name: web
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-u", "/app/web_app.py"]
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: APP_NAME
              value: {{ .name | quote }}
            - name: MESSAGE
              value: {{ .message | quote }}
            - name: COLOR
              value: {{ .color | quote }}
            # Downward API: app tự biết tên Pod, IP Pod, node đang chạy
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: web-app-code
---
# Service chỉ để Envoy Gateway tìm danh sách Pod (EndpointSlice). Envoy KHÔNG gửi tới ClusterIP này.
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Định tuyến L7 theo domain: Envoy đọc Host header (HTTP/1.1) hoặc :authority (HTTP/2)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
      sectionName: {{ $.Values.gateway.sectionName }}
  hostnames:
    {{- range .hosts }}
    - "{{ . }}.{{ $.Values.domain }}"
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Served-By-Route
                value: {{ .name }}
      backendRefs:
        - name: {{ .name }}
          port: 80
---
# Cách Envoy chọn Pod trong danh sách endpoint của Service
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .name }}-lb
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "web.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .name }}
  loadBalancer:
    {{- toYaml .loadBalancer | nindent 4 }}
  # Envoy tự loại Pod lỗi liên tục khỏi vòng chia tải (passive health check)
  healthCheck:
    passive:
      consecutive5XxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
{{- end }}
